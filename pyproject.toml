[project]
name = "ankihelperextension"
version = "0.1.0"
description = "Anki add-on that syncs daily review stats to the AnkiHelper backend and shows friends heatmaps"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "anki>=26.9.3",
    "aqt>=26.9.3",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["addon/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["addon", "tests"]
exclude = ["addon/vendor", "**/__pycache__"]
pythonVersion = "3.13"
